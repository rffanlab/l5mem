server {
    listen 9110;
    server_name _;
    include /etc/nginx/snippets/e5-lan-only.conf;
    client_max_body_size 256m;
    error_page 401 =302 http://192.168.1.158/login;

    location = /_e5/manager-auth {
        internal;
        proxy_pass http://127.0.0.1:18090/api/auth/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-E5-API-Key $http_x_e5_api_key;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 机器人走 API：鉴权失败回 401 JSON，不跳登录页
    location /api/ {
        auth_request /_e5/manager-auth;
        error_page 401 = @api401;
        proxy_pass http://127.0.0.1:19110;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_request_buffering off;
        proxy_read_timeout 600s;
    }
    location @api401 {
        default_type application/json;
        return 401 '{"error":"需要 E5 登录或 X-E5-API-Key"}';
    }

    location / {
        auth_request /_e5/manager-auth;
        proxy_pass http://127.0.0.1:19110;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
    }
}
